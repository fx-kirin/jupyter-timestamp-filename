[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-timestamp-filename"
version = "0.2.0"
description = "Jupyter Server extension to add timestamps to untitled notebook filenames"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "fx_kirin" }
]
dependencies = [
  "jupyter_server>=2,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["jupyter_timestamp_filename*"]

[tool.setuptools.data-files]
"etc/jupyter/jupyter_server_config.d" = ["jupyter-config/jupyter_server_config.d/jupyter_timestamp_filename.json"]
